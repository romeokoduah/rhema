name: Build Installers

on:
  push:
    branches:
      - feature/translation-and-songs
      - main
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows
          - os: macos-latest
            label: macos

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install JS dependencies
        run: bun install

      - name: Download public-domain Bible data
        run: bun run download:bible-data

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download copyrighted Bible translations
        run: |
          pip install meaningless
          python data/download-biblegateway.py
        env:
          PYTHONIOENCODING: utf-8

      - name: Build Bible SQLite database
        run: bun run build:bible

      - name: Download Whisper model
        run: |
          mkdir -p models
          curl -L -o models/ggml-tiny.en.bin "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny.en.bin"
        shell: bash

      - name: Install CMake
        uses: lukka/get-cmake@latest

      - name: Build Tauri installer
        run: bun run tauri build
        env:
          CFLAGS: ${{ matrix.label == 'windows' && '/MD' || '' }}
          CXXFLAGS: ${{ matrix.label == 'windows' && '/MD' || '' }}
          CMAKE_MSVC_RUNTIME_LIBRARY: ${{ matrix.label == 'windows' && 'MultiThreadedDLL' || '' }}
          TAURI_SIGNING_PRIVATE_KEY: ""

      # Windows artifacts
      - name: Upload Windows MSI
        if: matrix.label == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: rhema-windows-msi
          path: src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn

      - name: Upload Windows NSIS
        if: matrix.label == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: rhema-windows-exe
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn

      # macOS artifacts
      - name: Upload macOS DMG
        if: matrix.label == 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: rhema-macos-dmg
          path: src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: warn

      - name: Upload macOS App
        if: matrix.label == 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: rhema-macos-app
          path: src-tauri/target/release/bundle/macos/*.app
          if-no-files-found: warn
